<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BusFlow Pro</title>
<meta name="application-name" content="BusFlow Pro">
<meta name="description" content="Bus routes, live ETAs, driver logs and fleet operations.">
<meta name="theme-color" content="#0d47a1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111b26" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="BusFlow">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#e9eef3;--phone:#fff;--ink:#12202e;--mut:#5d6b79;--line:#dbe3ea;--card:#f3f6f9;--blue:#0d47a1;--on:#fff;--ok:#1b7f45;--warn:#b86200;--bad:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1118;--phone:#111b26;--ink:#e6edf4;--mut:#91a1b1;--line:#243344;--card:#182534;--blue:#6ea8ff;--on:#0b1118;--ok:#5fd18a;--warn:#f0a850;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1118;--phone:#111b26;--ink:#e6edf4;--mut:#91a1b1;--line:#243344;--card:#182534;--blue:#6ea8ff;--on:#0b1118;--ok:#5fd18a;--warn:#f0a850;--bad:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:420px}
.note{font-size:13px;color:var(--mut);margin:0 0 10px}
.phone{background:var(--phone);border:1px solid var(--line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;min-height:640px;position:relative}
header{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
header b{font-size:18px}header span{display:block;font-size:12px;color:var(--mut)}
main{flex:1;padding:14px 16px 90px;overflow-y:auto}
nav{display:flex;border-top:1px solid var(--line);background:var(--phone);position:absolute;left:0;right:0;bottom:0}
nav button{flex:1;padding:12px 2px;font-size:12px;background:none;border:0;color:var(--mut);font:inherit;font-size:13px;cursor:pointer}
nav button[aria-selected=true]{color:var(--blue);font-weight:700;box-shadow:inset 0 3px 0 var(--blue)}
h3{margin:14px 0 8px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--blue);color:var(--on);border-color:var(--blue)}
.btn{border-radius:10px;padding:10px 14px;font-weight:600}
.btn.p{background:var(--blue);color:var(--on);border-color:var(--blue)}
.btn.d{color:var(--bad);border-color:var(--bad);background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px}
.stop{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.stop:last-child{border:0}
.dot{width:12px;height:12px;border-radius:50%;margin-top:4px;border:2px solid var(--blue);flex:none}
.dot.DEPARTED{background:var(--mut);border-color:var(--mut)}.dot.APPROACHING{background:var(--blue)}
.stop small{color:var(--mut);display:block}
.late{color:var(--warn);font-weight:600}.tag{font-size:12px;font-weight:700}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
label{display:flex;gap:8px;align-items:center;font-size:14px;margin:8px 0}
select,input[type=text],input[type=email],input[type=password]{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--phone);color:var(--ink);font:inherit}
.toast{position:absolute;left:14px;right:14px;bottom:66px;background:var(--ink);color:var(--phone);padding:11px 14px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{color:var(--mut);padding:18px;text-align:center}
.mandala{position:absolute;inset:0;pointer-events:none;z-index:0;display:flex;align-items:center;justify-content:center;opacity:.5;overflow:hidden}
.mandala img{width:100%;height:100%;object-fit:cover}
.mandala svg{width:135%;max-width:none;height:auto;flex:none}
.phone>header,.phone>main{position:relative;z-index:1}
.noauth nav{display:none}.noauth main{padding-bottom:20px}
.rolebtn{display:block;width:100%;text-align:left;border:1px solid var(--line);color:var(--ink);font:inherit;cursor:pointer;margin-bottom:10px;padding:14px}
.rolebtn b{font-size:16px;display:block}.rolebtn small{color:var(--mut)}
.hint{font-size:12px;color:var(--mut);margin:10px 0}.fld{display:block;margin:10px 0 4px;font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
<div class="phone">
<div class="mandala" id="mnd" aria-hidden="true"></div>
<input type="file" id="picIn" accept="image/*" hidden>
<header><div style="display:flex;justify-content:space-between;align-items:center"><div><b>BusFlow Pro</b><span id="sub"></span></div><button class="chip" id="rst">Reset data</button></div><div class="row" id="thm" style="margin-top:10px" aria-label="Theme"></div></header>
<main id="main"></main>
<div class="toast" id="toast" role="status"></div>
<nav role="tablist"><button role="tab" data-t="pax">Passenger</button><button role="tab" data-t="drv">Driver Log</button><button role="tab" data-t="fleet">Fleet Ops</button><button role="tab" data-t="set">Settings</button></nav>
</div></div>

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function capF(){const g=id=>(document.getElementById(id)||{}).value;A.f=Object.assign(A.f||{},{name:g('au-name')??A.f.name,email:g('au-email')??A.f.email,lic:g('au-lic')??A.f.lic,route:g('au-route')??A.f.route})}
async function hashPw(email,pw){const s='busflow|'+email+'|'+pw;try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return'x'+h.toString(16)}
function drawAuth(){const f=A.f||{};document.querySelector('.phone').classList.add('noauth');
document.getElementById('sub').textContent=t('Welcome');document.getElementById('rst').textContent=t('Reset data');document.documentElement.lang=LANG();
let b=`<div class="row" style="margin-bottom:6px">${LANGS.map(([c,n])=>`<button class="chip" aria-pressed="${LANG()===c}" data-lang="${c}">${n}</button>`).join('')}</div>`;
if(A.step==='role'){b+=`<h3>${t('Choose how to continue')}</h3>`+[['PASSENGER','Track buses and ETAs'],['DRIVER','Log departures and emergencies'],['FLEET','Manage vans and drivers']].map(([r,d])=>`<button class="card rolebtn" data-role="${r}"><b>${roleName(r)}</b><small>${t(d)}</small></button>`).join('')+`<p class="hint">${t('Each account keeps one role. An account created as Passenger cannot sign in as Driver or Fleet.')}</p>`}
else{const cr=A.mode==='create';b+=`<button class="chip" data-authback>← ${t('Back')}</button><h3>${roleName(A.role)}</h3><div class="row"><button class="chip" aria-pressed="${!cr}" data-mode="signin">${t('Sign in')}</button><button class="chip" aria-pressed="${cr}" data-mode="create">${t('Create account')}</button></div>
${cr?`<label class="fld" for="au-name">${t('Full name')}</label><input type="text" id="au-name" autocomplete="name" value="${esc(f.name||'')}">`:''}
<label class="fld" for="au-email">${t('Email')}</label><input type="email" id="au-email" autocomplete="username" value="${esc(f.email||'')}">
<label class="fld" for="au-pw">${t('Password (min 6 characters)')}</label><input type="password" id="au-pw" autocomplete="${cr?'new-password':'current-password'}">
${cr&&A.role==='DRIVER'?`<label class="fld" for="au-lic">${t('Driving license number')}</label><input type="text" id="au-lic" value="${esc(f.lic||'')}"><label class="fld" for="au-route">${t('Route')}</label><select id="au-route">${Object.keys(S.routes).map(r=>`<option value="${r}" ${f.route===r?'selected':''}>${S.routes[r].split(' ')[0]}</option>`).join('')}</select>`:''}
${A.err?`<p class="bad" role="alert">${esc(A.err)}</p>`:''}
<button class="btn p" id="authGo" style="width:100%;margin-top:12px">${cr?t('Create account'):t('Sign in')}</button>
${!cr?`<p class="hint">${t('Demo accounts (password demo1234)')}: ${DEMO[A.role]}</p>`:''}`}
document.getElementById('main').innerHTML=b}
async function authSubmit(){const g=id=>(document.getElementById(id)||{}).value||'';capF();const email=g('au-email').trim().toLowerCase(),pw=g('au-pw');
const fail=m=>{A.err=m;drawAuth()};
if(!/^\S+@\S+\.\S+$/.test(email))return fail(t('Enter a valid email.'));
const u=S.users.find(x=>x.email===email);
if(A.mode==='signin'){
if(!u)return fail(t('No account found for this email. Create one first.'));
if(u.role!==A.role)return fail(t('This account is registered as {0}. It cannot sign in as {1}.',roleName(u.role),roleName(A.role)));
const ok=u.demoPw?pw===u.demoPw:(await hashPw(email,pw))===u.pw;
if(!ok)return fail(t('Wrong password.'));
return startSession(u,t('Welcome back, {0}!',u.name))}
if(u)return fail(t('An account with this email already exists as {0}.',roleName(u.role)));
const name=clean(g('au-name')),lic=clean(g('au-lic')),route=g('au-route')||'ROUTE-101';
if(!name||(A.role==='DRIVER'&&!lic))return fail(t('Fill in all fields.'));
if(pw.length<6)return fail(t('Password must be at least 6 characters.'));
const nu={email,name,role:A.role,pw:await hashPw(email,pw),created:Date.now()};if(A.role==='DRIVER')nu.lic=lic;
S.users.push(nu);
if(A.role==='DRIVER')S.vans.push({id:'VAN-'+(20+S.vans.length),drv:name,drvEmail:email,route,st:'IN_SERVICE',pax:0,cap:16,spd:TR[S.traffic[route]||'Moderate'][1],rep:null,reason:'On scheduled run'});
startSession(nu,t('Account created. Welcome, {0}!',name))}
function startSession(u,msg){S.session={email:u.email};S.tab={PASSENGER:'pax',DRIVER:'drv',FLEET:'fleet'}[u.role];A={step:'role',role:null,mode:'signin',err:'',f:{}};draw();toast(msg)}
function acct(){const u=me();return u?`<h3>${t('Account')}</h3><div class="card"><b>${u.name}</b><small style="display:block;color:var(--mut)">${u.email} · ${roleName(u.role)}</small><small style="display:block;color:var(--mut);margin:6px 0 10px">${t('Role is locked to this account.')}</small><button class="btn" id="logout">${t('Log out')}</button></div>`:''}
</script>
<script>
const KEY='busflow-pro-v2';
const seed=()=>({tab:'pax',route:'ROUTE-101',session:null,users:[{email:'sarah@busflow.demo',name:'Sarah Jenkins',role:'PASSENGER',demoPw:'demo1234'},{email:'rajesh@busflow.demo',name:'Rajesh Shrestha',role:'DRIVER',demoPw:'demo1234'},{email:'sunil@busflow.demo',name:'Sunil Karki',role:'DRIVER',demoPw:'demo1234'},{email:'meera@busflow.demo',name:'Meera Tamang',role:'DRIVER',demoPw:'demo1234'},{email:'admin@busflow.demo',name:'Fleet Dispatch',role:'FLEET',demoPw:'demo1234'}],traffic:{'ROUTE-101':'Moderate','ROUTE-202':'Moderate'},
routes:{'ROUTE-101':'R-101 Downtown – Airport','ROUTE-202':'R-202 Campus – Tech Corridor'},
stops:[
['ROUTE-101','Metro Central Terminal','08:00 AM','DEPARTED',2,'08:02 AM'],['ROUTE-101','Financial District Station','08:12 AM','DEPARTED',4,'08:16 AM'],
['ROUTE-101','South Park Boulevard','08:24 AM','APPROACHING',3],['ROUTE-101','Mission Bay Transit Center','08:35 AM','UPCOMING',3],['ROUTE-101','Airport Terminal 3','08:52 AM','UPCOMING',3],
['ROUTE-202','University Plaza','07:30 AM','APPROACHING',3],['ROUTE-202','Library Square','07:41 AM','UPCOMING',3],['ROUTE-202','Research Park','07:55 AM','UPCOMING',3],['ROUTE-202','Innovation Campus','08:10 AM','UPCOMING',3]
].map((a,i)=>({id:i,r:a[0],n:a[1],t:a[2],s:a[3],d:a[4],a:a[5]})),
vans:[{id:'VAN-04',drv:'Rajesh Shrestha',drvEmail:'rajesh@busflow.demo',route:'ROUTE-101',st:'IN_SERVICE',pax:9,cap:16,spd:34,rep:null,reason:'On scheduled run'},
{id:'VAN-09R',drv:'Sunil Karki',drvEmail:'sunil@busflow.demo',route:'ROUTE-101',st:'RESERVE',pax:0,cap:18,spd:0,rep:null,reason:'Standby'},
{id:'VAN-07',drv:'Meera Tamang',drvEmail:'meera@busflow.demo',route:'ROUTE-202',st:'IN_SERVICE',pax:6,cap:16,spd:34,rep:null,reason:'On scheduled run'}],
events:[],logs:[{v:'VAN-04',s:'Financial District Station',a:'08:16 AM',d:4}],ratings:[{drv:'Rajesh Shrestha',stars:5,by:'Sarah Jenkins',txt:'Smooth drive.'}]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.vans||!S.users)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const shift=(t,m)=>{const[h,r]=t.split(':');const ap=r.slice(-2);let tot=(parseInt(h)%12+(ap==='PM'?12:0))*60+parseInt(r)+m;const H=Math.floor(tot/60)%24,M=tot%60;return String(H%12||12).padStart(2,'0')+':'+String(M).padStart(2,'0')+' '+(H>=12?'PM':'AM')};
const eta=s=>shift(s.t,s.d);
const toast=m=>{const e=document.getElementById('toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2800)};
const live=r=>S.vans.find(v=>v.route===r&&v.st==='IN_SERVICE');
const me=()=>S.users.find(u=>S.session&&u.email===S.session.email);
const NAME=()=>me()?me().name:'';
const myVan=()=>S.vans.find(v=>S.session&&v.drvEmail===S.session.email);
const allowedTabs=()=>{const u=me();return u?{PASSENGER:['pax','set'],DRIVER:['drv','set'],FLEET:['fleet','set']}[u.role]:[]};
const rstops=r=>S.stops.filter(s=>s.r===r);
const drivers=()=>[...new Set(S.vans.map(v=>v.drv))];
const avg=d=>{const x=S.ratings.filter(r=>r.drv===d);return x.length?(x.reduce((a,b)=>a+b.stars,0)/x.length).toFixed(1):'–'};
const TR={Smooth:[0,48],Moderate:[3,34],Heavy:[8,18]};
function setTraffic(n){S.traffic[S.route]=n;const[d,sp]=TR[n];rstops(S.route).forEach(s=>{if(s.s!=='DEPARTED')s.d=d});S.vans.forEach(v=>{if(v.route===S.route&&v.st==='IN_SERVICE')v.spd=sp});toast(t('Traffic: {0}. ETAs recalculated.',t(n)));draw()}
function depart(delay){const v=myVan();if(!v||v.st!=='IN_SERVICE')return toast(t('Your van is not in service.'));
const next=rstops(v.route).find(s=>s.s!=='DEPARTED');if(!next)return toast(t('Route complete.'));
const b=+document.getElementById('bd').value,a=+document.getElementById('al').value;
next.s='DEPARTED';next.d=delay;next.a=shift(next.t,delay);
const later=rstops(v.route).filter(s=>s.s!=='DEPARTED');later.forEach((s,i)=>{s.d=delay;s.s=i?'UPCOMING':'APPROACHING'});
v.pax=Math.max(0,Math.min(v.cap,v.pax+b-a));S.logs.unshift({v:v.id,s:next.n,a:next.a,d:delay});
toast(later[0]?t('Departure confirmed at {0}. Next: {1}',next.a,later[0].n):t('Departure confirmed at {0}. Route complete.',next.a));draw()}
function emergency(reserve){const v=myVan();if(!v||v.st!=='IN_SERVICE')return toast(t('Van already out of service.'));
const why=document.getElementById('why').value||'Mechanical issue';const r=reserve&&S.vans.find(x=>x.st==='RESERVE');
if(r){r.st='IN_SERVICE';r.route=v.route;r.reason='Replacement for '+v.id;v.st='REPLACED';v.rep=r.id;toast(t('Reserve van {0} dispatched.',r.id))}
else{v.st='EMERGENCY_MAINTENANCE';toast(reserve?t('No reserve van available. Vehicle out of service.'):t('Vehicle marked out of service.'))}
v.spd=0;v.reason=why;S.events.unshift({id:'EMG-'+(100+S.events.length),van:v.id,rep:r?r.id:null,why,ok:false});draw()}
function resolve(id){const e=S.events.find(x=>x.id===id),v=S.vans.find(x=>x.id===e.van);v.st='IN_SERVICE';v.rep=null;v.reason='Maintenance resolved';
if(e.rep){const r=S.vans.find(x=>x.id===e.rep);r.st='RESERVE';r.spd=0;r.reason='Standby'}e.ok=true;toast(t('Resolved. Replacement van back on standby.'));draw()}
function rate(){const v=live(S.route);if(!v)return toast(t('No active van to rate on this route.'));
const stars=+document.getElementById('stars').value,txt=document.getElementById('cmt').value.trim();
S.ratings.unshift({drv:v.drv,stars,by:NAME(),txt});toast(t('Thanks! Rating saved for {0}.',v.drv));draw()}
const cls=s=>s==='IN_SERVICE'?'ok':s==='RESERVE'?'':'bad';
function pax(){const v=live(S.route),st=rstops(S.route),tn=S.traffic[S.route];
return `<div class="row">${Object.keys(S.routes).map(r=>`<button class="chip" aria-pressed="${S.route===r}" data-route="${r}">${S.routes[r].split(' ')[0]}</button>`).join('')}</div>
<p style="margin:10px 0 0;color:var(--mut);font-size:13px">${S.routes[S.route]}</p>
<h3>${t('Traffic')}</h3><div class="row">${Object.keys(TR).map(n=>`<button class="chip" aria-pressed="${tn===n}" data-tr="${n}">${t(n)}</button>`).join('')}</div>
${v?`<div class="card" style="margin-top:12px"><b>${v.id}</b> · ${v.drv} (${avg(v.drv)}★)<small style="display:block;color:var(--mut)">${v.pax}/${v.cap} ${t('seats taken')} · ${v.spd} km/h${v.reason.startsWith('Replacement')?' · '+t('replacement van'):''}</small></div>`:`<div class="card warn">${t('No van in service on this route right now.')}</div>`}
<h3>${t('Stops')}</h3>${st.map(s=>`<div class="stop"><span class="dot ${s.s}"></span><div style="flex:1"><b>${s.n}</b><small>${t('Scheduled')} ${s.t}</small></div><div style="text-align:right">${s.s==='DEPARTED'?`<span class="tag">${t('Left')} ${s.a}</span>`:`<b class="${s.d?'late':''}">${eta(s)}</b>${s.d?`<small class="late">+${s.d} ${t('min')}</small>`:''}`}</div></div>`).join('')}
<h3>${t('Rate your driver')}</h3><div class="row"><select id="stars" style="width:90px">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select><input type="text" id="cmt" placeholder="${t('Comment (optional)')}" style="flex:1"><button class="btn p" id="rateBtn">${t('Submit')}</button></div>`}
function drv(){const v=myVan();if(!v)return `<div class="empty">${t('No van assigned.')}</div>`;const next=v&&rstops(v.route).find(s=>s.s!=='DEPARTED'),ok=v&&v.st==='IN_SERVICE';
return `<div class="card"><b>${NAME()}</b> · ${avg(NAME())}★<small style="display:block;color:var(--mut)">${t('Van')} ${v.id} · <span class="${cls(v.st)}">${t(v.st.replace('_',' '))}</span> · ${S.routes[v.route].split(' ')[0]}</small></div>
${!ok?`<div class="card warn">${v.st==='RESERVE'?t('On standby. You will be assigned a route if a van breaks down.'):t('Your van is out of service.')}</div>`:
next?`<div class="card"><small style="color:var(--mut)">${t('Next stop')}</small><br><b>${next.n}</b><br>${t('Scheduled')} ${next.t} · ${t('ETA')} ${eta(next)}</div>
<div class="row"><label style="flex:1">${t('Delay')}<select id="dl"><option value="0">${t('On time')}</option><option value="2">+2</option><option value="4">+4</option><option value="6">+6</option></select></label>
<label style="flex:1">${t('Boarded')}<select id="bd">${[0,1,2,3,4,5,6].map(n=>`<option>${n}</option>`).join('')}</select></label>
<label style="flex:1">${t('Got off')}<select id="al">${[0,1,2,3,4,5,6].map(n=>`<option>${n}</option>`).join('')}</select></label></div>
<button class="btn p" id="depBtn" style="width:100%">${t('Record departure')}</button>
<h3>${t('Emergency')}</h3><input type="text" id="why" placeholder="${t('What happened? (e.g. brake warning)')}"><label><input type="checkbox" id="rsv" checked> ${t('Request reserve van')}</label><button class="btn d" id="emgBtn" style="width:100%">${t('Report emergency')}</button>`:`<div class="empty">${t('All stops completed.')}</div>`}
<h3>${t('Departure log')}</h3>${S.logs.filter(l=>!v||l.v===v.id).slice(0,8).map(l=>`<div class="stop"><div style="flex:1"><b>${l.s}</b></div><span>${l.a} <span class="${l.d>3?'late':''}">+${l.d}m</span></span></div>`).join('')||`<div class="empty">${t('No departures logged yet.')}</div>`}`}
function fleet(){return `<h3>${t('Vans')}</h3>${S.vans.map(v=>`<div class="card"><b>${v.id}</b> · ${v.drv}<br><span class="tag ${cls(v.st)}">${t(v.st.replace('_',' '))}</span> <small style="color:var(--mut)">${v.pax}/${v.cap} · ${v.reason}${v.rep?' · '+t('replaced by')+' '+v.rep:''}</small></div>`).join('')}
<h3>${t('Emergency events')}</h3>${S.events.length?S.events.map(e=>`<div class="card"><b>${e.id}</b> · ${e.van}${e.rep?' → '+e.rep:' '+t('(no replacement)')}<br><small style="color:var(--mut)">${e.why}</small><br><span class="tag ${e.ok?'ok':'bad'}">${e.ok?t('Resolved'):t('Open')}</span>${e.ok?'':`<button class="btn" data-res="${e.id}" style="margin-left:8px;padding:5px 10px">${t('Resolve')}</button>`}</div>`).join(''):`<div class="empty">${t('No emergencies reported.')}</div>`}
<h3>${t('Driver ratings')}</h3>${drivers().map(d=>`<div class="stop"><b style="flex:1">${d}</b><span>${avg(d)}★ (${S.ratings.filter(r=>r.drv===d).length})</span></div>`).join('')}`}
function draw(){save();if(!S.session||!me()){S.session=null;drawAuth();return}document.querySelector('.phone').classList.remove('noauth');if(!allowedTabs().includes(S.tab))S.tab=allowedTabs()[0];const tb=S.tab;document.getElementById('main').innerHTML=tb==='pax'?pax():tb==='drv'?drv():tb==='set'?sett():fleet();if(tb==='set')drawQR();
document.getElementById('sub').textContent=t({pax:'Commuter schedule & ETA',drv:'Driver route management',fleet:'Transit operations hub',set:'Settings'}[tb]);document.getElementById('rst').textContent=t('Reset data');document.documentElement.lang=LANG();
document.querySelectorAll('nav button').forEach(b=>{b.setAttribute('aria-selected',b.dataset.t===tb);b.hidden=!allowedTabs().includes(b.dataset.t);b.textContent=t({pax:'Passenger',drv:'Driver Log',fleet:'Fleet Ops',set:'Settings'}[b.dataset.t])});if(typeof applyTheme==='function')applyTheme()}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('au-'))authSubmit()});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.role){A.step='form';A.role=b.dataset.role;A.mode='signin';A.err='';draw()}else if(b.dataset.mode){capF();A.mode=b.dataset.mode;A.err='';draw()}else if(b.dataset.authback!==undefined){A.step='role';A.err='';draw()}else if(b.id==='authGo'){authSubmit()}else if(b.id==='logout'){S.session=null;A={step:'role',role:null,mode:'signin',err:'',f:{}};draw()}else if(b.dataset.t){if(allowedTabs().includes(b.dataset.t)){S.tab=b.dataset.t;draw()}}else if(b.dataset.route){S.route=b.dataset.route;draw()}
else if(b.dataset.tr)setTraffic(b.dataset.tr);else if(b.id==='depBtn')depart(+document.getElementById('dl').value);
else if(b.id==='emgBtn')emergency(document.getElementById('rsv').checked);else if(b.dataset.res)resolve(b.dataset.res);
else if(b.dataset.lang){T.lang=b.dataset.lang;try{localStorage.setItem(TKEY,JSON.stringify(T))}catch(e){}draw()}else if(b.id==='genQr'){S.apk=document.getElementById('apk').value.trim();draw();if(!S.apk)toast(t('Enter a link first.'))}else if(b.dataset.save){saveQR(b.dataset.save)}else if(b.id==='rateBtn')rate();else if(b.id==='rst'){S=seed();draw();toast(t('Data reset.'))}});
const TKEY='busflow-theme-v1';

function applyTheme(){const mn=document.getElementById('mnd');
if(mn){const k=String((BG||LION).length);if(mn.dataset.s!==k){mn.innerHTML=`<img alt="" src="${BG||LION}">`;mn.dataset.s=k}mn.style.opacity=(T.op||36)/100}
document.getElementById('thm').innerHTML=`<button class="chip" id="addPic">＋ ${t('Add picture')}</button>${BG?`<button class="chip" id="rmPic">${t('Remove picture')}</button>`:''}<label style="flex-basis:100%;font-size:12px;color:var(--mut)">${t('Picture strength')}<input type="range" id="picOp" min="15" max="85" value="${T.op||36}" style="flex:1"></label>`;
try{localStorage.setItem(TKEY,JSON.stringify(T))}catch(e){}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='addPic'){document.getElementById('picIn').click()}else if(b.id==='rmPic'){BG=null;try{localStorage.removeItem(BGKEY)}catch(err){}applyTheme()}});
document.getElementById('picIn').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;const bad=()=>toast(t('Could not read that picture.'));
const rd=new FileReader();rd.onerror=bad;rd.onload=()=>{const im=new Image();im.onerror=bad;im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
BG=c.toDataURL('image/jpeg',.82);let ok=true;try{localStorage.setItem(BGKEY,BG)}catch(err){ok=false}applyTheme();toast(ok?t('Picture saved.'):t('Picture is too large to save.'))};im.src=rd.result};rd.readAsDataURL(f)});
document.addEventListener('input',e=>{if(e.target.id==='picOp'){T.op=+e.target.value;const mn=document.getElementById('mnd');if(mn)mn.style.opacity=T.op/100;try{localStorage.setItem(TKEY,JSON.stringify(T))}catch(err){}}});
applyTheme();
draw();
</script>
